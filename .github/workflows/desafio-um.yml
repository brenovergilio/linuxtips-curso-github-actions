name: Desafio Um

on: 
    workflow_dispatch:
        inputs:
            image:
                description: 'Nome da imagem'
                required: true
                type: string

jobs:
    desafio_um:
        runs-on: ubuntu-latest
        steps:
            - name: Baixando a imagem com Docker Pull
              run: docker pull ${{ inputs.image }}
            
            - name: Listando imagens Docker
              run: docker images

            - name: Login no DockerHub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }} 
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Analisando vulnerabilidades na imagem
              uses: docker/scout-action@v1
              with:
                command: cves
                image: ${{ inputs.image }}
                exit-code: false