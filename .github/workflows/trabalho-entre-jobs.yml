name: Vendo arquivos compartilhados entre jobs

on: 
    push:
        branches:
            - main

jobs:
    job_1:
        runs-on: ubuntu-latest
        steps:
            - name: Confere versão do Ubuntu
              run: cat /etc/os-release

            - name: Exibir uma mensagem
              run: echo "Estou fazendo o curso de Github Actions da Linuxtips" > mensagem.txt
            
            - name: Qualquer outra coisa
              run: ls -lha
            
            - name: Le conteudo do arquivo
              run: cat mensagem.txt
            
            - uses: actions/upload-artifact@v4
              with:
                name: strigus
                path: mensagem.txt

    job_2:
      runs-on: ubuntu-latest
      steps:
        - name: Ver o conteudo do diretorio
          run: ls -lha

        - uses: actions/download-artifact@v4
          with:
            name: strigus
            path: mensagem.txt

        - name: Move o arquivo
          run: mv strigus/mensagem.txt . && rm -rf ./strigus

        - name: Acessa arquivo mensagem
          run: cat mensagem.txt